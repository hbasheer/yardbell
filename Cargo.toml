[package]
name = "yardbell"
version = "0.2.1"
edition = "2021"
description = "One page for AI coding agent sessions across all your machines: health, sessions, ports, and a terminal from any device."
license = "MIT"
readme = "README.md"
keywords = ["ai-agents", "claude", "tmux", "ssh", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie-signed"] }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
portable-pty = "0.8"
rand = "0.8"
regex = "1"
rpassword = "7"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
