<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Connect · Yardbell</title>
<style>
  :root {
    --bg: #ffffff;
    --side: #f8fafc;
    --surface: #ffffff;
    --hover: #f1f5f9;
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-ink: #ffffff;
    --accent-text: #1d4ed8;
    --bad-text: #b91c1c;
    --sans: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0b;
      --side: #0f1012;
      --surface: #0a0a0b;
      --hover: #17181b;
      --ink: #ededef;
      --ink-2: #c4c6cc;
      --muted: #8b8f98;
      --line: #1f2125;
      --line-strong: #2e3137;
      --accent-text: #93c5fd;
      --bad-text: #f87171;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--side);
    color: var(--ink);
    font: 14px/1.5 var(--sans);
    font-feature-settings: "cv11", "ss01";
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .connect { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .panel { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .app-icon { display: block; width: 48px; height: 48px; margin-bottom: 16px; }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.5; text-wrap: balance; }
  .lede { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  code { font-family: var(--mono); font-size: 0.92em; }
  .info { margin: -8px 0 20px; color: var(--accent-text); font-size: 13px; font-weight: 500; }
  .found { margin: 0 0 16px; }
  .found-label { margin: 0 0 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .found-list { display: grid; gap: 6px; }
  .found-server { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .found-server:hover { background: var(--hover, rgba(127,127,127,0.08)); }
  .found-server.picked { border-color: var(--accent); }
  .found-name { font-weight: 600; }
  .found-addr { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  label { display: grid; gap: 6px; margin-bottom: 14px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  input {
    font: 14px var(--sans);
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  input::placeholder { color: var(--muted); }
  input:focus-visible { outline-offset: 0; border-color: var(--accent); }
  .btn {
    font: 500 13px/1 var(--sans);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 38px;
    margin-top: 6px;
    padding: 0 12px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: background-color 120ms ease-out, border-color 120ms ease-out;
  }
  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:disabled { opacity: 0.55; cursor: progress; }
  .err { color: var(--bad-text); min-height: 1.5em; margin: 10px 0 0; font-size: 13px; }
  .switch-mode {
    font: 500 13px/1.5 var(--sans);
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 8px 0 0;
    border: 0;
    border-top: 1px solid var(--line);
    background: none;
    color: var(--accent-text);
    cursor: pointer;
    text-align: center;
  }
  .switch-mode:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="connect">
  <form class="panel" id="form" novalidate>
    <img class="app-icon" src="icon.png" width="48" height="48" alt="" draggable="false">
    <h1>Connect to Yardbell</h1>
    <p class="lede">Enter the address of your Yardbell server and the passcode set with <code>yardbell passcode</code>.</p>
    <p class="info" id="info" role="status" hidden></p>
    <div class="found" id="found" hidden>
      <p class="found-label">On your mesh</p>
      <div class="found-list" id="found-list"></div>
    </div>
    <label>Server address
      <input type="text" name="server" id="server" placeholder="http://100.64.0.10:4000" autocomplete="url" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>Passcode
      <input type="password" name="passcode" id="passcode" autocomplete="current-password" required>
    </label>
    <button class="btn" id="submit" type="submit">Connect</button>
    <p class="err" id="err" role="alert"></p>
    <button class="switch-mode" id="to-local" type="button">No server yet? Run one on this machine</button>
  </form>
  <form class="panel" id="local-form" novalidate hidden>
    <img class="app-icon" src="icon.png" width="48" height="48" alt="" draggable="false">
    <h1>Run Yardbell on this machine</h1>
    <p class="lede" id="local-lede"></p>
    <label>Passcode
      <input type="password" name="passcode" id="local-passcode" autocomplete="new-password" minlength="6" required>
    </label>
    <label id="local-repeat-label">Repeat passcode
      <input type="password" name="repeat" id="local-repeat" autocomplete="new-password" minlength="6">
    </label>
    <button class="btn" id="local-submit" type="submit">Start and sign in</button>
    <p class="err" id="local-err" role="alert"></p>
    <button class="switch-mode" id="to-connect" type="button">Connect to a server on another machine</button>
  </form>
</main>
<script src="connect.js"></script>
</body>
</html>
