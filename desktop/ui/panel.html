<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Yardbell</title>
<style>
  :root {
    --side: #f8fafc;
    --surface: #ffffff;
    --hover: #f1f5f9;
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-ink: #ffffff;
    --accent-soft: #dbeafe;
    --accent-text: #1d4ed8;
    --ok: #16a34a;
    --warn: #d97706;
    --warn-text: #b45309;
    --bad: #dc2626;
    --bad-text: #b91c1c;
    --mem: #64748b;
    --mem-track: #ffffff;
    --sans: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --side: #0f1012;
      --surface: #0a0a0b;
      --hover: #17181b;
      --ink: #ededef;
      --ink-2: #c4c6cc;
      --muted: #8b8f98;
      --line: #1f2125;
      --line-strong: #2e3137;
      --accent-soft: #172554;
      --accent-text: #93c5fd;
      --ok: #22c55e;
      --warn: #f59e0b;
      --warn-text: #fbbf24;
      --bad: #ef4444;
      --bad-text: #f87171;
      --mem: #a1a1aa;
      --mem-track: #0a0a0b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; overflow: hidden; }
  body {
    background: var(--surface);
    color: var(--ink);
    font: 400 13px/1.35 var(--sans);
    font-feature-settings: "cv11", "ss01";
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .panel { padding: 12px; border: 1px solid var(--line-strong); }
  .card {
    display: grid;
    gap: 2px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--side);
  }
  .note { margin: 0; padding: 8px; color: var(--muted); }
  .note.bad { color: var(--bad-text); }
  .row {
    font: inherit;
    color: inherit;
    width: 100%;
    margin: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    text-align: left;
    cursor: default;
  }
  .row:hover { background: var(--hover); }
  .machine { display: grid; gap: 7px; padding: 8px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 96px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .meter .value { text-align: right; white-space: nowrap; }
  .machine-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .state.bad { color: var(--bad-text); overflow: hidden; text-overflow: ellipsis; }
  .pct { color: var(--ink); font-weight: 600; }
  .hot .pct { color: var(--warn-text); }
  .full .pct { color: var(--bad-text); }
  .mem-bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--mem-track);
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .mem-agents { background: var(--accent); }
  .mem-other { background: var(--mem); }
  .hot .mem-other { background: var(--warn); }
  .full .mem-other { background: var(--bad); }
  h2 { margin: 0 0 4px; padding: 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .sessions { display: grid; gap: 2px; max-height: 288px; overflow-y: auto; }
  .session { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 6px 8px; }
  .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    font-size: 12px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-text);
    white-space: nowrap;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .badge::before { animation: none; } }
  .actions { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .view { display: grid; gap: 12px; }
  .btn.icon-btn { flex: none; width: 32px; padding: 0; color: var(--ink-2); }
  .icon-btn svg { width: 16px; height: 16px; }
  .btn.quiet { border-color: transparent; background: transparent; }
  .btn.quiet:hover { background: var(--hover); }
  .btn.danger { color: var(--bad-text); }
  .settings-head { display: flex; align-items: center; gap: 4px; margin: -4px 0 -4px -4px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .switches { padding: 4px; }
  .switch { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 6px 8px; border-radius: 6px; color: var(--ink); }
  .switch:hover { background: var(--hover); }
  .switch span { flex: 1; }
  .switch input {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    flex: none;
    width: 28px;
    height: 16px;
    margin: 0;
    border-radius: 999px;
    background: var(--line-strong);
    transition: background 120ms ease-out;
  }
  .switch input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffffff;
    transition: transform 120ms ease-out;
  }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(12px); }
  @media (prefers-reduced-motion: reduce) { .switch input, .switch input::after { transition: none; } }
  .btn {
    font: 500 13px/1 var(--sans);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    cursor: default;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
</style>
</head>
<body>
<main class="panel" id="panel">
  <div class="view" id="main-view">
    <section>
      <h2 id="machines-title">Machines</h2>
      <div class="card" id="machines" aria-labelledby="machines-title"></div>
    </section>
    <section id="sessions-section" hidden>
      <h2 id="sessions-title">Sessions</h2>
      <div class="sessions" id="sessions" role="list" aria-labelledby="sessions-title"></div>
    </section>
    <div class="actions">
      <button class="btn" type="button" id="new-session">New session</button>
      <button class="btn primary" type="button" id="open-app">Open Yardbell</button>
      <button class="btn icon-btn" type="button" id="open-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 1.5h2.8l.4 1.9c.4.2.8.4 1.1.7l1.9-.6 1.4 2.4-1.5 1.3a4.6 4.6 0 0 1 0 1.6l1.5 1.3-1.4 2.4-1.9-.6c-.3.3-.7.5-1.1.7l-.4 1.9H6.6l-.4-1.9c-.4-.2-.8-.4-1.1-.7l-1.9.6-1.4-2.4 1.5-1.3a4.6 4.6 0 0 1 0-1.6L1.8 5.9l1.4-2.4 1.9.6c.3-.3.7-.5 1.1-.7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </div>
  <div class="view" id="settings-view" hidden>
    <div class="settings-head">
      <button class="btn icon-btn quiet" type="button" id="back" aria-label="Back" title="Back">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Settings</h1>
    </div>
    <section>
      <h2 id="notifications-title">Notifications on this Mac</h2>
      <div class="card switches" id="notifications" aria-labelledby="notifications-title"></div>
    </section>
    <section>
      <h2 id="startup-title">Startup</h2>
      <div class="card switches" id="startup" aria-labelledby="startup-title"></div>
    </section>
    <div class="actions">
      <button class="btn" type="button" id="disconnect">Sign out</button>
      <button class="btn danger" type="button" id="quit">Quit Yardbell</button>
    </div>
  </div>
</main>
<script src="panel.js"></script>
</body>
</html>
