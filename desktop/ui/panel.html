<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Yardbell</title>
<style>
  :root {
    --surface: #ffffff;
    --raised: #f6f6f7;
    --hover: #efeff1;
    --ink: #18181b;
    --ink-2: #3f3f46;
    --muted: #71717a;
    --line: #e7e7ea;
    --line-strong: #d4d4d8;
    --primary: #18181b;
    --primary-hover: #27272a;
    --primary-ink: #fafafa;
    --ok: #16a34a;
    --warn: #d97706;
    --warn-text: #b45309;
    --bad: #dc2626;
    --bad-text: #b91c1c;
    --bar: #a1a1aa;
    --bar-track: #ececef;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #18181b;
      --raised: #1f1f23;
      --hover: #27272a;
      --ink: #fafafa;
      --ink-2: #d4d4d8;
      --muted: #a1a1aa;
      --line: #2a2a2f;
      --line-strong: #3f3f46;
      --primary: #fafafa;
      --primary-hover: #e4e4e7;
      --primary-ink: #18181b;
      --ok: #22c55e;
      --warn: #f59e0b;
      --warn-text: #fbbf24;
      --bad: #ef4444;
      --bad-text: #f87171;
      --bar: #71717a;
      --bar-track: #2a2a2f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; min-width: 0; }
  [hidden] { display: none !important; }
  html, body { margin: 0; overflow: hidden; }
  body {
    background: var(--surface);
    color: var(--ink);
    font: 400 13px/1.35 var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--ink-2); outline-offset: -2px; }
  .panel { display: grid; padding: 10px; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
  .view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 0; }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .conn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  h2 { margin: 0 0 4px; padding: 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); }
  .note { margin: 0; padding: 8px; color: var(--muted); font-size: 12px; }
  .note.bad { color: var(--bad-text); }
  .row {
    font: inherit;
    color: inherit;
    width: 100%;
    margin: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    text-align: left;
    cursor: default;
    overflow: hidden;
  }
  .row:hover { background: var(--hover); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--bar); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .dot.working { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.working { animation: none; } }
  .machine { display: grid; gap: 6px; padding: 7px 8px; }
  .machine-head { display: flex; align-items: center; gap: 8px; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { margin-left: auto; flex: none; max-width: 60%; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state.bad { color: var(--bad-text); }
  .meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .meter { display: grid; gap: 3px; font-size: 11px; color: var(--muted); }
  .meter-top { display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; }
  .pct { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .hot .pct { color: var(--warn-text); }
  .full .pct { color: var(--bad-text); }
  .bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--bar-track); }
  .bar-agents { background: var(--ink-2); }
  .bar-other { background: var(--bar); }
  .hot .bar-other { background: var(--warn); }
  .full .bar-other { background: var(--bad); }
  .sessions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; max-height: 300px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
  .group { padding: 6px 8px 2px; font-size: 11px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 5px 8px; }
  .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity { flex: none; font-size: 11.5px; color: var(--muted); }
  .activity.on { color: var(--ok); }
  .actions { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .btn {
    font: 500 12.5px/1 var(--sans);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
    cursor: default;
    white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.icon-btn { flex: none; width: 30px; padding: 0; color: var(--ink-2); }
  .icon-btn svg { width: 15px; height: 15px; }
  .btn.quiet { border-color: transparent; background: transparent; }
  .btn.quiet:hover { background: var(--hover); }
  .btn.danger { color: var(--bad-text); }
  .settings-head { display: flex; align-items: center; gap: 4px; margin: -2px 0 -2px -2px; }
  h1 { margin: 0; font-size: 13px; font-weight: 600; }
  .switches { padding: 3px; }
  .switch { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 5px 8px; border-radius: 6px; color: var(--ink); }
  .switch:hover { background: var(--hover); }
  .switch span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch input {
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    flex: none;
    width: 28px;
    height: 16px;
    margin: 0;
    border-radius: 999px;
    background: var(--line-strong);
    transition: background 120ms ease-out;
  }
  .switch input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffffff;
    transition: transform 120ms ease-out;
  }
  .switch input:checked { background: var(--primary); }
  @media (prefers-color-scheme: dark) { .switch input:checked::after { background: var(--primary-ink); } }
  .switch input:checked::after { transform: translateX(12px); }
  @media (prefers-reduced-motion: reduce) { .switch input, .switch input::after { transition: none; } }
</style>
</head>
<body>
<main class="panel" id="panel">
  <div class="view" id="main-view">
    <div class="head"><span class="brand">Yardbell</span><span class="conn" id="conn"></span></div>
    <section>
      <h2 id="machines-title">Machines</h2>
      <div class="card" id="machines" aria-labelledby="machines-title"></div>
    </section>
    <section id="sessions-section" hidden>
      <h2 id="sessions-title">Sessions</h2>
      <div class="sessions" id="sessions" role="list" aria-labelledby="sessions-title"></div>
    </section>
    <div class="actions">
      <button class="btn" type="button" id="new-session">New session</button>
      <button class="btn primary" type="button" id="open-app">Open Yardbell</button>
      <button class="btn icon-btn" type="button" id="open-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 1.5h2.8l.4 1.9c.4.2.8.4 1.1.7l1.9-.6 1.4 2.4-1.5 1.3a4.6 4.6 0 0 1 0 1.6l1.5 1.3-1.4 2.4-1.9-.6c-.3.3-.7.5-1.1.7l-.4 1.9H6.6l-.4-1.9c-.4-.2-.8-.4-1.1-.7l-1.9.6-1.4-2.4 1.5-1.3a4.6 4.6 0 0 1 0-1.6L1.8 5.9l1.4-2.4 1.9.6c.3-.3.7-.5 1.1-.7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </div>
  <div class="view" id="settings-view" hidden>
    <div class="settings-head">
      <button class="btn icon-btn quiet" type="button" id="back" aria-label="Back" title="Back">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Settings</h1>
    </div>
    <section>
      <h2 id="notifications-title">Notifications on this Mac</h2>
      <div class="card switches" id="notifications" aria-labelledby="notifications-title"></div>
    </section>
    <section>
      <h2 id="startup-title">Startup</h2>
      <div class="card switches" id="startup" aria-labelledby="startup-title"></div>
    </section>
    <div class="actions">
      <button class="btn" type="button" id="disconnect">Sign out</button>
      <button class="btn danger" type="button" id="quit">Quit Yardbell</button>
    </div>
  </div>
</main>
<script src="panel.js"></script>
</body>
</html>
