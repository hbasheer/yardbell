<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Yardbell tabs</title>
<style>
  :root {
    --card: #ffffff;
    --strip: color-mix(in srgb, #0a0a0a 8%, #ffffff);
    --ink: #0a0a0a;
    --muted: #696969;
    --line: #e5e5e5;
    --hover: #f5f5f5;
    --ring: #a1a1a1;
    --danger: #b91c1c;
    --term-bar: #0f1012;
    --term-ink: #ededef;
    --term-muted: #8b8f98;
    --term-hover: #2e3137;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: #171717;
      --strip: color-mix(in srgb, #f0f0f0 8%, #171717);
      --ink: #f0f0f0;
      --muted: #acacac;
      --line: rgb(255 255 255 / 0.07);
      --hover: #262626;
      --ring: #737373;
      --danger: #f87171;
      color-scheme: dark;
    }
  }
  :root[data-term="light"] { --term-bar: #ffffff; --term-ink: #1f2328; --term-muted: #5f6670; --term-hover: #eceef0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--strip);
    color: var(--ink);
    font: 400 12px/1 var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
  .bar { position: relative; display: flex; height: 100%; }
  .bar::after { content: ""; position: absolute; inset: auto 0 0; height: 1px; background: var(--line); }
  .tabs { position: relative; display: flex; flex: 1; min-width: 0; height: 100%; overflow: hidden; }
  .tab {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 1 220px;
    min-width: 0;
    padding: 0 6px 0 10px;
    overflow: hidden;
    border-right: 1px solid var(--line);
    color: var(--muted);
    transition: color 120ms ease-out;
  }
  .tab.session { container-type: inline-size; }
  .tab.pinned { flex: none; padding-right: 12px; }
  .tab:hover { color: var(--ink); }
  .tab.selected { z-index: 1; background: var(--card); color: var(--ink); }
  .tab.selected::after { content: ""; position: absolute; inset: auto 0 0; height: 2px; background: currentColor; }
  .tab.session.selected { min-width: 112px; background: var(--term-bar); color: var(--term-ink); }
  .logo { flex: none; width: 14px; height: 14px; }
  .name {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: default;
  }
  .pinned .name { font-weight: 500; }
  .close {
    display: grid;
    place-items: center;
    flex: none;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--muted);
    cursor: default;
    opacity: 0;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }
  .tab:hover .close, .tab.selected .close, .close:focus-visible { opacity: 1; }
  .close:hover { background: var(--hover); color: var(--ink); }
  .selected.session .close { color: var(--term-muted); }
  .selected.session .close:hover { background: var(--term-hover); color: var(--term-ink); }
  .close svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .account {
    display: grid;
    place-items: center;
    flex: none;
    width: 36px;
    height: 100%;
    padding: 0;
    border: 0;
    border-left: 1px solid var(--line);
    background: none;
    color: var(--muted);
    cursor: default;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }
  .account svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .account:hover { background: var(--hover); color: var(--ink); }
  .account.confirming { width: auto; padding: 0 12px; color: var(--danger); font: 500 12px/1 var(--sans); }
  @media (prefers-reduced-motion: reduce) { .tab, .close, .account { transition: none; } }
</style>
</head>
<body>
<div class="bar">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Tabs"></nav>
  <button class="account" id="sign-out" type="button" aria-label="Sign out"></button>
</div>
<template id="logo"><svg class="logo" viewBox="9 9 46 46" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5"><rect x="13" y="13" width="16" height="16" rx="4.5"/><rect x="35" y="13" width="16" height="16" rx="4.5"/><rect x="13" y="35" width="16" height="16" rx="4.5"/></g><circle cx="43" cy="43" r="9.5" fill="#f5a524"/></svg></template>
<template id="cross"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></template>
<script src="tabs.js"></script>
</body>
</html>
