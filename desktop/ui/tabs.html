<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Yardbell tabs</title>
<style>
  :root {
    --side: #f8fafc;
    --surface: #ffffff;
    --hover: #f1f5f9;
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --term-bar: #0f1012;
    --term-ink: #ededef;
    --term-muted: #8b8f98;
    --term-hover: #2e3137;
    --sans: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --side: #0f1012;
      --surface: #0a0a0b;
      --hover: #17181b;
      --ink: #ededef;
      --ink-2: #c4c6cc;
      --muted: #8b8f98;
      --line: #1f2125;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--side);
    color: var(--ink);
    font: 500 13px/1 var(--sans);
    font-feature-settings: "cv11", "ss01";
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bar {
    position: relative;
    display: flex;
    height: 100%;
  }
  .bar::after {
    content: "";
    position: absolute;
    inset: auto 0 0;
    height: 1px;
    background: var(--line);
  }
  .tabs {
    position: relative;
    display: flex;
    flex: 1;
    min-width: 0;
    height: 100%;
    overflow: hidden;
  }
  .account {
    flex: none;
    height: 100%;
    padding: 0 14px;
    border: 0;
    border-left: 1px solid var(--line);
    background: none;
    color: var(--muted);
    font: inherit;
    cursor: default;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }
  .account:hover { background: var(--hover); color: var(--ink-2); }
  .account.confirming { color: #b91c1c; }
  @media (prefers-color-scheme: dark) { .account.confirming { color: #f87171; } }
  .tabs::after {
    content: "";
    position: absolute;
    inset: auto 0 0;
    height: 1px;
    background: var(--line);
  }
  .tab {
    position: relative;
    display: flex;
    align-items: center;
    flex: 0 1 220px;
    min-width: 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
    color: var(--muted);
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }
  .tab.session { container-type: inline-size; }
  .tab.pinned { flex: none; }
  .tab:hover { background: var(--hover); color: var(--ink-2); }
  .tab.selected {
    z-index: 1;
    background: var(--surface);
    color: var(--ink);
    box-shadow: inset 0 2px var(--accent);
  }
  .tab.session.selected { min-width: 112px; background: var(--term-bar); color: var(--term-ink); }
  .name {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 12px;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: default;
  }
  .session .name { padding-right: 4px; }
  .close {
    display: grid;
    place-items: center;
    flex: none;
    width: 20px;
    height: 20px;
    margin-right: 8px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--muted);
    cursor: default;
    opacity: 0;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }
  .tab:hover .close, .tab.selected .close, .close:focus-visible { opacity: 1; }
  .close:hover { background: var(--line); color: var(--ink); }
  .selected.session .close { color: var(--term-muted); }
  .selected.session .close:hover { background: var(--term-hover); color: var(--term-ink); }
  .close svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
  }
  @container (max-width: 96px) {
    .name { padding: 0 4px 0 8px; }
    .close { margin-right: 4px; }
    .tab:not(.selected, :hover, :focus-within) .close { display: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Tabs"></nav>
  <button class="account" id="sign-out" type="button">Sign out</button>
</div>
<template id="cross"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></template>
<script src="tabs.js"></script>
</body>
</html>
