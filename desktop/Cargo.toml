[package]
name = "yardbell-desktop"
version = "0.2.0"
edition = "2021"
publish = false

[[bin]]
name = "yardbell-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.7"

[dependencies]
yardbell = { path = ".." }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
percent-encoding = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
