<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Yardbell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/400.css" integrity="sha384-EfdL97hcnol8T4/i0jMEua2ounMTPBCKaU1QluVPWTv7V8xcTTfxSL1VWdjjpdRl" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/500.css" integrity="sha384-JJ19IMHzOJ2sAC2xNzhH4cnXNAY9idh1hFgmr9ePDd3e68jl+XEPiMVKTwYyGBcc" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/600.css" integrity="sha384-NWCWDXFWH0ixL3DXbRVGmMD8PbUKTQZA1n9RtBQEkxKQdln+Ui814nUpfzeU0ws+" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/400.css" integrity="sha384-kTJy0lu/NAzlcHdqtuJe5q6vDA1M8gHcMp6/umVo4Nqoa7La36UBhvWtM112y0i4" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/500.css" integrity="sha384-Ddvk1ngA7kUJqPAsRbHuZhooNDKcluU0BTRmYku5LWezQzInPKkiH6/z8GGyw5Ow" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="/side.js"></script>
<script src="/live.js"></script>
</head>
<body data-page="dashboard">
<div class="app">
  <aside class="side">
    <div class="side-head">
      <a class="wordmark" href="/">Yardbell</a>
      <span class="side-summary" id="nav-summary" aria-live="polite"></span>
    </div>
    <nav class="machine-nav" aria-label="Machines">
      <p class="nav-label">Machines</p>
      <ul id="nav-machines" class="nav-list"></ul>
      <a class="nav-add" href="/add"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Add machine</a>
    </nav>
    <div class="side-foot">
      <p class="vpn" id="nav-vpn"></p>
      <a class="side-link" href="/" aria-current="page">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg>Dashboard
      </a>
      <a class="side-link" href="/workspace">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M8 3v10M8 8h5.5"/></svg>Workspace
      </a>
      <a class="side-link" href="/dispatch">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11v6h-6l-3 2.5v-2.5h-2z"/></svg>Dispatch
      </a>
      <a class="side-link" href="/settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.3"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings
      </a>
      <button class="side-link theme-toggle" type="button" data-theme-toggle></button>
      <button class="side-link" id="logout" type="button">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3H3.5v10h3M10 5l3 3-3 3M13 8H6.5"/></svg>Log out
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="main-head">
      <h1 id="title">Sessions</h1>
      <span class="updated" id="updated" aria-live="polite"></span>
      <span class="spacer"></span>
      <button class="btn icon-btn" id="refresh-btn" type="button" aria-label="Check machines now" title="Check machines now">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3.5v3h-3M3 12.5v-3h3M12.4 6.5A5 5 0 0 0 3.6 5.2M3.6 9.5a5 5 0 0 0 8.8 1.3"/></svg>
      </button>
      <a class="btn desk-only" href="/add">Add machine</a>
      <button class="btn primary" id="new-btn" type="button">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New session
      </button>
    </header>

    <div class="toolbar" role="search">
      <label class="search">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input type="search" id="search" placeholder="Search sessions" aria-label="Search sessions by folder, branch, ticket or agent" autocomplete="off" autocapitalize="off" spellcheck="false">
        <kbd class="search-key" aria-hidden="true">/</kbd>
      </label>
      <div class="segmented" role="group" aria-label="Show sessions">
        <button type="button" data-status="all" aria-pressed="true">All<span class="seg-count" id="count-all"></span></button>
        <button type="button" data-status="active" aria-pressed="false">Working<span class="seg-count" id="count-active"></span></button>
        <button type="button" data-status="idle" aria-pressed="false">Idle<span class="seg-count" id="count-idle"></span></button>
      </div>
    </div>

    <div id="offline" class="banner warn" role="alert" hidden>
      <div class="banner-text"><strong>Yardbell is not responding.</strong><span>Showing the last data received. Retrying every 5 seconds.</span></div>
    </div>
    <div id="mesh-banner" class="banner" role="alert" hidden></div>

    <div id="groups" class="groups"><p class="checking">Checking machines…</p></div>
    <p class="shortcuts" aria-hidden="true"><kbd>/</kbd> search · <kbd>j</kbd> <kbd>k</kbd> move · <kbd>Enter</kbd> open · <kbd>n</kbd> new session</p>
  </main>
</div>

<div id="menu" class="menu" role="menu" hidden></div>
<div id="toast" role="status"></div>
<script src="/nav.js"></script>
<script src="/newsession.js"></script>
<script type="module" src="/dashboard.js"></script>
</body>
</html>
