<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Yardbell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.6/index.css" integrity="sha384-p+EgvS3+MmUG4ztXXPqzFtb7IwR4h5ljta/AfLhM0vj1rtoFd3fsPDFTy2+m+W5U" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.6/index.css" integrity="sha384-+vQW7zp7HknV1Hb+78y01bvnE+c/tci1UJL3SVVr3mh96Ff2muGpGQP/rI6QWmH7" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="/live.js"></script>
<script src="/machines.js"></script>
<script src="/pull.js"></script>
<script src="/board.js"></script>
</head>
<body data-page="dashboard">
<main class="shell-main shell-page dashboard-main" id="main">
<nav class="dash-chips" id="chips" aria-label="Machines"></nav>
<header class="main-head page-bar">
  <h1 id="title">Sessions</h1>
  <button class="btn quiet icon-btn" id="clear-project" type="button" title="Show every project" hidden>
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
  </button>
  <span class="updated pg-chip" id="updated" aria-live="polite"></span>
  <span class="spacer"></span>
  <button class="btn icon-btn" id="refresh-btn" type="button" aria-label="Check machines now" title="Check machines now">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3.5v3h-3M3 12.5v-3h3M12.4 6.5A5 5 0 0 0 3.6 5.2M3.6 9.5a5 5 0 0 0 8.8 1.3"/></svg>
  </button>
  <a class="btn desk-only" href="/add">Add machine</a>
  <button class="btn primary" id="new-btn" type="button">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New session
  </button>
</header>

<div class="toolbar page-tools" role="search">
  <div class="segmented pill-tabs" role="group" aria-label="Show sessions">
    <button type="button" data-status="all" aria-pressed="true">All<span class="seg-count" id="count-all"></span></button>
    <button type="button" data-status="active" aria-pressed="false">Working<span class="seg-count" id="count-active"></span></button>
    <button type="button" data-status="idle" aria-pressed="false">Idle<span class="seg-count" id="count-idle"></span></button>
  </div>
  <span class="tools-sep" aria-hidden="true"></span>
  <div class="segmented pill-tabs view-toggle" id="view-toggle" role="group" aria-label="Lay out sessions">
    <button type="button" data-view="machines" aria-pressed="true" title="Sessions grouped by machine">Machines</button>
    <button type="button" data-view="board" aria-pressed="false" title="Sessions from every machine in lanes, by what they need next">Board</button>
  </div>
  <label class="search">
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input type="search" id="search" placeholder="Search sessions" aria-label="Search sessions by folder, branch, ticket or agent" autocomplete="off" autocapitalize="off" spellcheck="false">
    <kbd class="search-key" aria-hidden="true">/</kbd>
  </label>
</div>

<div id="offline" class="banner warn" role="alert" hidden>
  <div class="banner-text"><strong>Yardbell is not responding.</strong><span>Showing the last data received. Retrying every 5 seconds.</span></div>
</div>
<div id="mesh-banner" class="banner" role="alert" hidden></div>
<div id="health-banner" class="banner warn" role="status" hidden></div>

<div id="groups" class="groups"><p class="checking">Checking machines…</p></div>
<p class="shortcuts" aria-hidden="true"><kbd>/</kbd> search · <kbd>j</kbd> <kbd>k</kbd> move · <kbd>Enter</kbd> open · <kbd>n</kbd> new session</p>
</main>

<div id="menu" class="menu" role="menu" hidden></div>
<div id="toast" role="status"></div>
<script src="/shell.js"></script>
<script src="/strip.js"></script>
<script src="/usage.js"></script>
<script src="/palette.js"></script>
<script src="/tree.js"></script>
<script src="/worktree.js"></script>
<script src="/insights.js"></script>
<script src="/newsession.js"></script>
<script type="module" src="/dashboard.js"></script>
</body>
</html>
