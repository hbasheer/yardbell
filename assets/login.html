<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Log in · Yardbell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.6/index.css" integrity="sha384-p+EgvS3+MmUG4ztXXPqzFtb7IwR4h5ljta/AfLhM0vj1rtoFd3fsPDFTy2+m+W5U" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.6/index.css" integrity="sha384-+vQW7zp7HknV1Hb+78y01bvnE+c/tci1UJL3SVVr3mh96Ff2muGpGQP/rI6QWmH7" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<main class="login">
  <form class="panel" id="form">
    <span class="wordmark">Yardbell</span>
    <p class="lede">Enter the passcode set with <code>yardbell passcode</code>.</p>
    <label>Passcode
      <input type="password" name="passcode" autocomplete="current-password" autofocus required>
    </label>
    <button class="btn primary wide" type="submit">Log in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = e.target.querySelector("button");
  button.disabled = true;
  try {
    const res = await fetch("/login", { method: "POST", body: new URLSearchParams(new FormData(e.target)) });
    if (res.ok) { location.href = "/"; return; }
    const data = await res.json().catch(() => ({}));
    document.getElementById("err").textContent = data.error || "Login failed";
  } catch {
    document.getElementById("err").textContent = "Yardbell is not reachable. Is it running?";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
