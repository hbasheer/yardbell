<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Dispatch · Yardbell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/400.css" integrity="sha384-EfdL97hcnol8T4/i0jMEua2ounMTPBCKaU1QluVPWTv7V8xcTTfxSL1VWdjjpdRl" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/500.css" integrity="sha384-JJ19IMHzOJ2sAC2xNzhH4cnXNAY9idh1hFgmr9ePDd3e68jl+XEPiMVKTwYyGBcc" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/600.css" integrity="sha384-NWCWDXFWH0ixL3DXbRVGmMD8PbUKTQZA1n9RtBQEkxKQdln+Ui814nUpfzeU0ws+" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/400.css" integrity="sha384-kTJy0lu/NAzlcHdqtuJe5q6vDA1M8gHcMp6/umVo4Nqoa7La36UBhvWtM112y0i4" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/500.css" integrity="sha384-Ddvk1ngA7kUJqPAsRbHuZhooNDKcluU0BTRmYku5LWezQzInPKkiH6/z8GGyw5Ow" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="/side.js"></script>
<script src="/live.js"></script>
<script src="/pull.js"></script>
<script>if (window.top !== window.self) document.documentElement.classList.add("embedded");</script>
</head>
<body data-page="dispatch">
<div class="app">
  <aside class="side">
    <div class="side-head">
      <a class="wordmark" href="/">Yardbell</a>
      <span class="side-summary" id="nav-summary" aria-live="polite"></span>
    </div>
    <nav class="machine-nav" aria-label="Machines">
      <p class="nav-label">Machines</p>
      <ul id="nav-machines" class="nav-list"></ul>
      <a class="nav-add" href="/add"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Add machine</a>
    </nav>
    <div class="side-foot">
      <p class="vpn" id="nav-vpn"></p>
      <a class="side-link" href="/">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg>Dashboard
      </a>
      <a class="side-link" href="/workspace">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M8 3v10M8 8h5.5"/></svg>Workspace
      </a>
      <a class="side-link" href="/dispatch" aria-current="page">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11v6h-6l-3 2.5v-2.5h-2z"/></svg>Dispatch
      </a>
      <a class="side-link" href="/settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.3"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings
      </a>
      <button class="side-link theme-toggle" type="button" data-theme-toggle></button>
      <button class="side-link" id="logout" type="button">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3H3.5v10h3M10 5l3 3-3 3M13 8H6.5"/></svg>Log out
      </button>
    </div>
  </aside>

  <main class="main dispatch-main">
    <a class="back-link" href="/"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg>Dashboard</a>
    <header class="main-head"><h1>Dispatch</h1><a class="btn quiet small-link" href="/settings#dispatch">Settings</a><button class="btn quiet icon-btn embed-only" type="button" id="hide-panel" aria-label="Hide Dispatch" title="Hide Dispatch"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6 3v10M10.5 6.5 9 8l1.5 1.5"/></svg></button></header>
    <div class="dispatch">
      <aside class="dispatch-side" id="dispatch-side" aria-label="Conversations and tasks">
        <button class="btn primary dispatch-new" type="button" id="new-chat">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New conversation
        </button>
        <details class="convos" id="convos" open>
          <summary class="convos-head"><span><svg class="icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>Conversations</span><button class="btn quiet danger" type="button" id="clear-all" hidden>Clear all</button></summary>
          <ul class="convo-list" id="convo-list"></ul>
        </details>
        <details class="convos tasks" id="tasks" open>
          <summary class="convos-head"><span><svg class="icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>Tasks</span><button class="btn quiet" type="button" id="task-new">New task</button></summary>
          <form class="task-form" id="task-form" hidden>
            <label>Name <input type="text" name="name" maxlength="60" autocomplete="off" required></label>
            <label>What to ask Dispatch <textarea name="text" rows="4" required></textarea></label>
            <div class="row-actions"><button class="btn quiet" type="button" id="task-cancel">Cancel</button><button class="btn primary" type="submit">Save task</button></div>
          </form>
          <ul class="convo-list task-list" id="task-list"></ul>
          <button class="link-btn task-restore" type="button" id="task-restore" hidden>Restore default tasks</button>
        </details>
      </aside>
      <div class="dispatch-resize" id="dispatch-resize" role="separator" aria-orientation="vertical" aria-label="Resize conversations" aria-controls="dispatch-side" tabindex="0" title="Drag to resize. Double-click to reset."></div>
      <div class="dispatch-chat">
        <div class="dispatch-sessions" id="dispatch-sessions" hidden></div>
        <div class="dispatch-log" id="dispatch-log" aria-live="polite"></div>
        <div class="dispatch-thinking" id="dispatch-thinking" role="status" hidden><span class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></span><span id="thinking-word">Working</span></div>
        <form class="dispatch-compose" id="dispatch-form">
          <div class="compose-box">
            <div class="compose-menu" id="compose-menu" role="listbox" hidden></div>
            <textarea name="text" rows="2" aria-label="Message Dispatch" aria-describedby="send-key" aria-autocomplete="list" aria-controls="compose-menu" placeholder="Fix the flaky checkout test in acme/web on branch eng-1234"></textarea>
            <div class="dispatch-actions">
              <div class="compose-tools">
                <button class="compose-tool" type="button" id="insert-task" title="Insert a saved task. Typing / does the same.">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M9.5 5.5l-3 5"/></svg>Tasks
                </button>
                <button class="compose-tool icon-only" type="button" id="insert-name" aria-label="Insert a machine, session or folder" title="Insert a machine, session or folder. Typing @ does the same.">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.2"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
                </button>
                <button class="compose-tool" type="button" id="insert-scan" title="Scan a folder for dead code, test gaps or security problems">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3M2.5 8h11"/></svg>Scan
                </button>
                <button class="compose-tool" type="button" id="save-as-task" title="Keep this message as a task">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8v11L8 10.6 4 13.5z"/></svg>Save as task
                </button>
              </div>
              <button class="compose-hint" type="button" id="send-key">Enter to send, Shift+Enter for a new line</button>
              <button class="compose-stop" type="button" id="dispatch-stop" hidden title="Stop Dispatch's reply. Sessions it started keep running.">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1"/></svg>Stop
              </button>
              <button class="compose-send" type="submit" id="dispatch-send" aria-label="Send" title="Send" disabled>
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="/nav.js"></script>
<script type="module" src="/dispatch.js"></script>
</body>
</html>
