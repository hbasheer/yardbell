<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Dispatch · Yardbell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.6/index.css" integrity="sha384-p+EgvS3+MmUG4ztXXPqzFtb7IwR4h5ljta/AfLhM0vj1rtoFd3fsPDFTy2+m+W5U" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.6/index.css" integrity="sha384-+vQW7zp7HknV1Hb+78y01bvnE+c/tci1UJL3SVVr3mh96Ff2muGpGQP/rI6QWmH7" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="/live.js"></script>
<script src="/pull.js"></script>
<script>if (window.top !== window.self) document.documentElement.classList.add("embedded");</script>
</head>
<body data-page="dispatch">


  <main class="main shell-main dispatch-main" id="main">
    <header class="main-head"><h1>Dispatch</h1><h2 class="chat-title" id="chat-title"></h2><button class="btn quiet icon-btn speak-toggle" type="button" id="speak-toggle" aria-pressed="false" aria-label="Read replies aloud" hidden>
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.2L8 3.5v9L4.7 10H2.5z"/><path class="speak-waves" d="M10.5 6a3 3 0 0 1 0 4M12.5 4.5a5.5 5.5 0 0 1 0 7"/><path class="speak-cross" d="M10.5 6.5l3 3M13.5 6.5l-3 3"/></svg>
    </button><a class="btn quiet small-link" href="/settings#dispatch">Settings</a></header>
    <div class="dispatch-tabs" id="dispatch-tabs">
      <div class="segmented" role="tablist" aria-label="Dispatch">
        <button type="button" role="tab" data-tab="chat" aria-selected="true" aria-controls="dispatch-chat">Chat</button>
        <button type="button" role="tab" data-tab="convos" aria-selected="false" aria-controls="convos" tabindex="-1">Chats <span class="seg-count"></span></button>
        <button type="button" role="tab" data-tab="tasks" aria-selected="false" aria-controls="tasks" tabindex="-1">Tasks <span class="seg-count"></span></button>
      </div>
      <button class="btn quiet icon-btn" type="button" id="tab-new" aria-label="New conversation" title="New conversation"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    </div>
    <div class="dispatch" id="dispatch">
      <aside class="dispatch-side" id="dispatch-side" aria-label="Conversations and tasks">
        <button class="btn primary dispatch-new" type="button" id="new-chat">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New conversation
        </button>
        <details class="convos" id="convos" open>
          <summary class="convos-head"><span><svg class="icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>Conversations</span><button class="btn quiet danger" type="button" id="clear-all" hidden>Clear all</button></summary>
          <ul class="convo-list" id="convo-list"></ul>
        </details>
        <details class="convos tasks" id="tasks" open>
          <summary class="convos-head"><span><svg class="icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>Tasks</span><button class="btn quiet" type="button" id="task-new">New task</button></summary>
          <form class="task-form" id="task-form" hidden>
            <label>Name <input type="text" name="name" maxlength="60" autocomplete="off" required></label>
            <label>What to ask Dispatch <textarea name="text" rows="4" required></textarea></label>
            <p class="task-version" id="task-version" hidden><span id="task-version-word"></span><button class="link-btn" type="button" id="task-history">History</button></p>
            <div class="row-actions"><button class="btn quiet" type="button" id="task-cancel">Cancel</button><button class="btn primary" type="submit">Save task</button></div>
          </form>
          <ul class="convo-list task-list" id="task-list"></ul>
          <button class="link-btn task-restore" type="button" id="task-restore" hidden>Restore default tasks</button>
        </details>
      </aside>
      <div class="dispatch-chat" id="dispatch-chat">
        <div class="dispatch-sessions" id="dispatch-sessions" hidden></div>
        <div class="dispatch-log" id="dispatch-log" aria-live="polite"></div>
        <div class="dispatch-thinking" id="dispatch-thinking" role="status" hidden><span class="thinking-dots" aria-hidden="true"><span></span><span></span><span></span></span><span id="thinking-word">Working</span></div>
        <form class="dispatch-compose" id="dispatch-form">
          <div class="compose-box">
            <div class="compose-menu" id="compose-menu" role="listbox" hidden></div>
            <div class="compose-plus-menu" id="compose-plus-menu" role="menu" aria-label="Attach and more" hidden>
              <button class="compose-plus-item" type="button" role="menuitem" id="attach-file" title="Attach images, PDFs or text files. Dropping or pasting them works too.">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 7.5l-5.2 5.2a3.2 3.2 0 0 1-4.5-4.5l5.4-5.4a2.1 2.1 0 0 1 3 3L6.3 11.2a1 1 0 0 1-1.5-1.5L9.7 4.8"/></svg><span class="compose-plus-label">Attach files</span><span class="compose-plus-hint">Images, PDFs, text</span>
              </button>
              <button class="compose-plus-item" type="button" role="menuitem" id="save-as-task" title="Keep this message as a task">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8v11L8 10.6 4 13.5z"/></svg><span class="compose-plus-label">Save as task</span>
              </button>
              <div class="compose-plus-sep" role="separator"></div>
              <button class="compose-plus-item" type="button" role="menuitem" id="send-key">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5"/><path d="M4 7h.01M6.5 7h.01M9 7h.01M11.5 7h.01M5 10h6"/></svg><span class="compose-plus-label">Enter to send, Shift+Enter for a new line</span>
              </button>
            </div>
            <div class="dictation-pill" id="dictation-pill" role="group" aria-label="Dictation" hidden></div>
            <div class="compose-files" id="compose-files" hidden></div>
            <div class="compose-editor is-empty" id="dispatch-input" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message Dispatch" aria-autocomplete="list" aria-controls="compose-menu" aria-expanded="false" spellcheck="true" data-placeholder="Ask anything, @ to name a machine, session or folder, / for tasks"></div>
            <input type="file" id="attach-input" multiple hidden>
            <div class="dispatch-actions">
              <div class="compose-tools">
                <button class="compose-tool icon-only" type="button" id="compose-plus" aria-haspopup="menu" aria-expanded="false" aria-controls="compose-plus-menu" aria-label="Attach and more" title="Attach files, save as a task, choose the send key">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
                </button>
                <button class="compose-tool icon-only" type="button" id="insert-task" aria-label="Insert a saved task" title="Insert a saved task. Typing / does the same.">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M9.5 5.5l-3 5"/></svg>
                </button>
                <button class="compose-tool icon-only" type="button" id="insert-name" aria-label="Insert a machine, session or folder" title="Insert a machine, session or folder. Typing @ does the same.">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.2"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
                </button>
                <button class="compose-tool icon-only" type="button" id="insert-scan" aria-label="Scan a folder" title="Scan a folder for dead code, test gaps or security problems">
                  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.5v-3h3M10.5 2.5h3v3M13.5 10.5v3h-3M5.5 13.5h-3v-3M2.5 8h11"/></svg>
                </button>
              </div>
              <a class="runs-on" id="runs-on" href="/settings#dispatch" hidden><span class="runs-on-label"></span><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></a>
              <button class="compose-tool icon-only mic" type="button" id="mic" aria-pressed="false" aria-label="Dictate" hidden>
                <svg class="icon mic-on" viewBox="0 0 16 16" aria-hidden="true"><rect x="6" y="1.5" width="4" height="7.5" rx="2"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5"/></svg><svg class="icon mic-off" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.75" y="4.75" width="6.5" height="6.5" rx="1"/></svg>
              </button>
              <button class="compose-stop" type="button" id="dispatch-stop" hidden aria-label="Stop" title="Stop Dispatch's reply. Sessions it started keep running.">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1"/></svg>
              </button>
              <button class="compose-send" type="submit" id="dispatch-send" aria-label="Send" title="Send" disabled>
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>
<div id="toast" role="status"></div>
<script src="/machines.js"></script>
<script src="/shell.js"></script>
<script src="/strip.js"></script>
<script src="/usage.js"></script>
<script src="/palette.js"></script>
<script src="/insights.js"></script>
<script type="module" src="/dispatch.js"></script>
</body>
</html>
