<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dispatch · Yardbell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.0.20/index.css" integrity="sha384-6QsiPFEuz7gYJPDZq103sCr5aKoBCbqAXJq1fEUzeUHeJmXFTMGzGuUmfP4j5w5b" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/400.css" integrity="sha384-8X0qYYsBdYZ9bk70hw4HTDsWIeMfYCwYmUcsezfamiqI024ZDkBKbaTx68Kwh6wx" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body data-page="dispatch">
<div class="app">
  <aside class="side">
    <div class="side-head">
      <a class="wordmark" href="/">Yardbell</a>
      <span class="side-summary" id="nav-summary" aria-live="polite"></span>
    </div>
    <nav class="machine-nav" aria-label="Machines">
      <p class="nav-label">Machines</p>
      <ul id="nav-machines" class="nav-list"></ul>
      <a class="nav-add" href="/add"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Add machine</a>
    </nav>
    <div class="side-foot">
      <p class="vpn" id="nav-vpn"></p>
      <a class="side-link" href="/workspace">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M8 3v10M8 8h5.5"/></svg>Workspace
      </a>
      <a class="side-link" href="/dispatch" aria-current="page">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11v6h-6l-3 2.5v-2.5h-2z"/></svg>Dispatch
      </a>
      <a class="side-link" href="/settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.3"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings
      </a>
      <button class="side-link theme-toggle" type="button" data-theme-toggle></button>
      <button class="side-link" id="logout" type="button">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3H3.5v10h3M10 5l3 3-3 3M13 8H6.5"/></svg>Log out
      </button>
    </div>
  </aside>

  <main class="main dispatch-main">
    <a class="back-link" href="/"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4 6 8l4 4"/></svg>Dashboard</a>
    <header class="main-head"><h1>Dispatch</h1><a class="btn quiet small-link" href="/settings#dispatch">Settings</a><button class="btn" type="button" id="new-chat">New conversation</button></header>
    <div class="dispatch">
      <details class="convos" id="convos" open>
        <summary class="convos-head"><span>Conversations</span><button class="btn quiet danger" type="button" id="clear-all" hidden>Clear all</button></summary>
        <ul class="convo-list" id="convo-list"></ul>
      </details>
      <div class="dispatch-chat">
        <div class="dispatch-sessions" id="dispatch-sessions" hidden></div>
        <div class="dispatch-log" id="dispatch-log" aria-live="polite"></div>
        <form class="dispatch-compose" id="dispatch-form">
          <div class="dispatch-tasks" id="dispatch-tasks"></div>
          <textarea name="text" rows="3" placeholder="Fix the flaky checkout test in acme/web on a new branch eng-1234-checkout-flake" required></textarea>
          <div class="dispatch-actions">
            <span class="help" id="dispatch-status" role="status"></span>
            <button class="btn danger" type="button" id="dispatch-stop" hidden>Stop</button>
            <button class="btn primary" type="submit" id="dispatch-send">Send</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="/nav.js"></script>
<script src="/dispatch.js"></script>
</body>
</html>
