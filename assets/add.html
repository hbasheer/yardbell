<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Add machine · Yardbell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.6/index.css" integrity="sha384-p+EgvS3+MmUG4ztXXPqzFtb7IwR4h5ljta/AfLhM0vj1rtoFd3fsPDFTy2+m+W5U" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.6/index.css" integrity="sha384-+vQW7zp7HknV1Hb+78y01bvnE+c/tci1UJL3SVVr3mh96Ff2muGpGQP/rI6QWmH7" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="/live.js"></script>
<script src="/machines.js"></script>
</head>
<body data-page="add" data-column="none">
<main class="shell-main shell-page add-main" id="main">
<header class="main-head page-bar"><h1>Add machine</h1></header>
<div class="page-body">
  <section class="pg-card">
    <div class="section-head pg-card-head"><h2>Machines on your mesh</h2><span class="machine-status-inline">pick one to fill in the form</span></div>
    <div class="pg-card-body"><div class="peers" id="peers"><p class="loading">Looking for mesh peers…</p></div></div>
  </section>

  <section class="pg-card">
    <div class="section-head pg-card-head"><h2>Connect</h2></div>
    <form class="panel pg-card-body" id="form">
      <div class="grid2">
        <label>Short name <input type="text" name="name" placeholder="pro" pattern="[a-z0-9-]+" autocapitalize="off" required></label>
        <label>Username on that machine <input type="text" name="user" autocapitalize="off" autocomplete="off" required></label>
        <label>Mesh IP or hostname <input type="text" name="ip" placeholder="100.x.x.x or studio-mini" autocapitalize="off" required></label>
        <label>Project folder <input type="text" name="root" placeholder="Pick it after the check" autocapitalize="off" readonly></label>
      </div>
      <button class="btn primary" type="submit">Check and add</button>
      <ol class="checklist" id="checklist"></ol>
    </form>
  </section>

  <section class="pg-card">
    <div class="section-head pg-card-head"><h2>In Yardbell</h2></div>
    <ul class="rows" id="known"></ul>
  </section>
</div>
</main>
<div id="toast" role="status"></div>
<script src="/shell.js"></script>
<script src="/strip.js"></script>
<script src="/usage.js"></script>
<script src="/palette.js"></script>
<script src="/add.js"></script>
</body>
</html>
