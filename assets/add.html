<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Add machine · Yardbell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/400.css" integrity="sha384-8X0qYYsBdYZ9bk70hw4HTDsWIeMfYCwYmUcsezfamiqI024ZDkBKbaTx68Kwh6wx" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.0.20/index.css" integrity="sha384-6QsiPFEuz7gYJPDZq103sCr5aKoBCbqAXJq1fEUzeUHeJmXFTMGzGuUmfP4j5w5b" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="add">
<div class="app">
  <aside class="side">
    <div class="side-head">
      <a class="wordmark" href="/">Yardbell</a>
      <span class="side-summary" id="nav-summary" aria-live="polite"></span>
    </div>
    <nav class="machine-nav" aria-label="Machines">
      <p class="nav-label">Machines</p>
      <ul id="nav-machines" class="nav-list"></ul>
      <a class="nav-add" href="/add" aria-current="page"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Add machine</a>
    </nav>
    <div class="side-foot">
      <p class="vpn" id="nav-vpn"></p>
      <a class="side-link" href="/settings">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3"/></svg>Settings
      </a>
      <button class="side-link" id="logout" type="button">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3H3.5v10h3M10 5l3 3-3 3M13 8H6.5"/></svg>Log out
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="main-head"><h1>Add machine</h1></header>
    <div class="page-body">
  <section>
    <div class="section-head"><h2>Machines on your mesh</h2><span class="machine-status-inline">pick one to fill in the form</span></div>
    <div class="peers" id="peers"><p class="loading">Looking for mesh peers…</p></div>
  </section>

  <section>
    <div class="section-head"><h2>Connect</h2></div>
    <form class="panel" id="form">
      <div class="grid2">
        <label>Short name <input type="text" name="name" placeholder="pro" pattern="[a-z0-9-]+" autocapitalize="off" required></label>
        <label>Username on that machine <input type="text" name="user" autocapitalize="off" autocomplete="off" required></label>
        <label>Mesh IP or hostname <input type="text" name="ip" placeholder="100.x.x.x or studio-mini" autocapitalize="off" required></label>
        <label>Project folder <input type="text" name="root" placeholder="filled in after the check" autocapitalize="off"></label>
      </div>
      <button class="btn primary" type="submit">Check and add</button>
      <ol class="checklist" id="checklist"></ol>
    </form>
  </section>

  <section>
    <div class="section-head"><h2>In Yardbell</h2></div>
    <ul class="rows" id="known"></ul>
  </section>
    </div>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="/nav.js"></script>
<script src="/add.js"></script>
</body>
</html>
