name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m 1 '^version = ' desktop/Cargo.toml | cut -d '"' -f 2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in desktop/Cargo.toml. Tag v$version, or change the version first."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Yardbell ${{ github.ref_name }}
          releaseBody: |
            Desktop app for macOS and Linux. Install steps are in the
            [README](${{ github.server_url }}/${{ github.repository }}#apps).

            - macOS: `Yardbell_*_universal.dmg`. The app is not notarized by Apple, so macOS
              blocks the first launch; the README explains how to allow it.
            - Linux: `Yardbell_*_amd64.AppImage` (run `chmod +x` on it first) or
              `Yardbell_*_amd64.deb`.
          releaseDraft: true
          args: ${{ matrix.args }}
